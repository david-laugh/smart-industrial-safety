<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PPE 이벤트 대시보드</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app-view">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>PPE 미착용 이벤트</h1>
        </div>
        <div class="topbar-right">
          <label class="switch" title="새 이벤트를 실시간으로 받아 목록에 반영">
            <input id="live-toggle" type="checkbox" />
            <span>실시간</span>
          </label>
        </div>
      </header>

      <main class="container">
        <!-- 필터 -->
        <section class="filters" aria-label="필터">
          <div class="field">
            <span class="field-label">기간</span>
            <div class="seg" id="range-seg" role="radiogroup">
              <button type="button" data-range="24h">24시간</button>
              <button type="button" data-range="7d">7일</button>
              <button type="button" data-range="30d">30일</button>
              <button type="button" data-range="custom">직접 지정</button>
            </div>
            <div id="custom-range" class="custom-range" hidden>
              <input id="custom-from" type="date" aria-label="시작일" />
              <span class="muted">~</span>
              <input id="custom-to" type="date" aria-label="종료일" />
            </div>
          </div>

          <div class="field">
            <span class="field-label">장치</span>
            <details class="dropdown" id="device-dropdown">
              <summary id="device-summary">전체 장치</summary>
              <div class="dropdown-panel" id="device-options"></div>
            </details>
          </div>

          <div class="field">
            <span class="field-label">위반 유형</span>
            <div class="chips" id="type-chips">
              <label class="chip"><input type="checkbox" value="HELMET_MISSING" /> 안전모 미착용</label>
              <label class="chip"><input type="checkbox" value="VEST_MISSING" /> 안전조끼 미착용</label>
            </div>
          </div>

          <button id="reset-filters" class="btn ghost small" type="button">초기화</button>
        </section>

        <!-- 요약 -->
        <section class="kpis" id="kpis" aria-label="요약"></section>

        <!-- 추이 -->
        <section class="card">
          <div class="card-head">
            <h2 id="chart-title">일별 이벤트 수</h2>
            <span class="muted small" id="chart-sub"></span>
          </div>
          <div class="chart" id="chart"></div>
        </section>

        <!-- 목록 -->
        <section class="card">
          <div class="card-head">
            <h2>이벤트 목록</h2>
            <span class="muted small" id="list-meta"></span>
          </div>
          <div id="new-events" class="new-events" hidden>
            <button type="button" class="btn small" id="show-new">새 이벤트 <b id="new-count">0</b>건 보기</button>
          </div>
          <div class="table-wrap">
            <table class="events">
              <thead>
                <tr>
                  <th>발생 시각 <span class="muted small" id="tz-label"></span></th>
                  <th>장치</th>
                  <th>위반 유형</th>
                  <th class="num">인원</th>
                  <th>시각 출처</th>
                  <th>모델</th>
                </tr>
              </thead>
              <tbody id="events-body"></tbody>
            </table>
          </div>
          <p id="list-empty" class="empty" hidden>조건에 맞는 이벤트가 없습니다.</p>
          <p id="list-error" class="error" role="alert" hidden></p>
          <nav class="pager" aria-label="페이지">
            <button id="prev-page" class="btn ghost small" type="button">이전</button>
            <span id="page-info" class="muted small"></span>
            <button id="next-page" class="btn ghost small" type="button">다음</button>
          </nav>
        </section>
      </main>

      <!-- 상세 -->
      <div id="detail-backdrop" class="backdrop" hidden></div>
      <aside id="detail" class="detail" aria-label="이벤트 상세" hidden>
        <div class="detail-head">
          <h2>이벤트 상세</h2>
          <button id="detail-close" class="btn ghost small" type="button" aria-label="닫기">닫기</button>
        </div>
        <div id="detail-body" class="detail-body"></div>
      </aside>

      <div id="chart-tip" class="tooltip" hidden></div>
    </div>

    <!-- config.local.js: FastAPI 서버가 환경변수로 생성. 정적 서버로 열 때는 선택 파일(커밋 금지).
         config.js 보다 먼저 로드되어야 한다. -->
    <script src="js/config.local.js"></script>
    <script src="js/config.js"></script>
    <script src="js/sample-data.js"></script>
    <script src="js/data-source.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
